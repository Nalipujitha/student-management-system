services:
  student-management-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-management-system:latest
    container_name: student_app_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - student_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  student_data:
    driver: local
